name: orders-pilot

x-tools: &tools
  build:
    context: .
    dockerfile: tools/Dockerfile
  image: orders-pilot-tools:latest
  networks: [pilot]

services:
  mysql:
    image: mysql:8.0
    container_name: pilot-mysql
    command: >
      --server-id=1 --log-bin=mysql-bin --binlog-format=ROW --binlog-row-image=FULL
      --binlog-expire-logs-seconds=172800
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports: ["${PORT_MYSQL}:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 30s
    networks: [pilot]

  postgres:
    image: postgres:16
    container_name: pilot-postgres
    command: postgres -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["${PORT_POSTGRES}:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [pilot]

  kafka:
    image: apache/kafka:3.9.0
    container_name: pilot-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${PORT_KAFKA}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports: ["${PORT_KAFKA}:29092"]
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks: [pilot]

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: pilot-kafka-init
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in ordini-mysql ordini-postgres; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic $$t --partitions 3 --replication-factor 1
        done
    restart: "no"
    networks: [pilot]

  mongodb:
    image: mongo:7
    container_name: pilot-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports: ["${PORT_MONGO}:27017"]
    volumes:
      - mongo_data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.getSiblingDB('Ordini').getCollectionNames().includes('ordini') || quit(1)\""]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    networks: [pilot]

  connect:
    build: ./connect
    image: orders-pilot-connect:latest
    container_name: pilot-connect
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: pilot-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    ports: ["${PORT_CONNECT}:8083"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks: [pilot]

  connect-init:
    <<: *tools
    container_name: pilot-connect-init
    command: ["python", "/app/init/register_connectors.py"]
    env_file: .env
    depends_on:
      connect: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      mysql: {condition: service_healthy}
      postgres: {condition: service_healthy}
      mongodb: {condition: service_healthy}
    restart: "no"

  nifi:
    image: apache/nifi:1.28.1
    container_name: pilot-nifi
    environment:
      NIFI_WEB_HTTP_PORT: "8080"
      NIFI_WEB_HTTP_HOST: "0.0.0.0"
      NIFI_JVM_HEAP_INIT: 1g
      NIFI_JVM_HEAP_MAX: 2g
    ports: ["${PORT_NIFI}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/nifi-api/flow/about > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks: [pilot]

  nifi-init:
    <<: *tools
    container_name: pilot-nifi-init
    command: ["python", "/app/init/nifi_flow.py"]
    env_file: .env
    depends_on:
      nifi: {condition: service_healthy}
      mongodb: {condition: service_healthy}
    restart: "no"

  metabase:
    image: metabase/metabase:v0.50.26
    container_name: pilot-metabase
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: Europe/Rome
    ports: ["${PORT_METABASE}:3000"]
    volumes:
      - metabase_data:/metabase-data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks: [pilot]

  metabase-init:
    <<: *tools
    container_name: pilot-metabase-init
    command: ["python", "/app/init/metabase_setup.py"]
    env_file: .env
    depends_on:
      metabase: {condition: service_healthy}
      mongodb: {condition: service_healthy}
    restart: "no"

  order-generator-mysql:
    <<: *tools
    container_name: pilot-order-generator-mysql
    command: ["python", "/app/generator/order_generator.py"]
    environment:
      TARGET_DB: mysql
      INTERVAL_SECONDS: ${MYSQL_GENERATOR_INTERVAL}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    depends_on:
      mysql: {condition: service_healthy}
    restart: unless-stopped

  order-generator-postgres:
    <<: *tools
    container_name: pilot-order-generator-postgres
    command: ["python", "/app/generator/order_generator.py"]
    environment:
      TARGET_DB: postgres
      INTERVAL_SECONDS: ${POSTGRES_GENERATOR_INTERVAL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

networks:
  pilot:
    name: orders-pilot-net

volumes:
  mysql_data:
  pg_data:
  kafka_data:
  mongo_data:
  metabase_data:
